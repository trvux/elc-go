services:
  elc-go:
    build: .
    container_name: elc-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: elc-redis
    restart: unless-stopped
    # No `ports:`/volume on purpose: only reachable over the internal
    # Compose network (`redis:6379`, same reasoning as postgres below), and
    # holds only rate-limit counters + AI response caches — ephemeral by
    # design, losing it on restart is fine, no persistence needed. Optional
    # at the app level too: REDIS_URL unset means internal/ai falls back to
    # in-memory rate limiting and no caching (see docs/rfc/2026-08-18-ai-chat-redis.md).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: elc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elc
      POSTGRES_USER: elc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No `ports:` here on purpose — elc-go reaches this over the internal
    # Compose network (`postgres:5432`), and a production DB has no business
    # being reachable from outside the Docker network. For local dev (`air`
    # run on the host, needs a published port), see docker-compose.override.yml
    # (gitignored, never deployed).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elc"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
