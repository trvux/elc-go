services:
  elc-go:
    build: .
    container_name: elc-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to loopback on purpose: Docker's published ports bypass UFW
    # (DNAT in PREROUTING, never reaches the INPUT chain), so "8090:8090"
    # exposed the API to the whole internet, skipping nginx. Next.js reaches
    # it via GO_API_URL=http://localhost:8090 on the same host. See
    # docs/rfc/2026-10-08-vps-observability-hardening.md (V2).
    ports:
      - "127.0.0.1:8090:8090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env

  postgres:
    image: postgres:17-alpine
    container_name: elc-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: elc
      POSTGRES_USER: elc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No `ports:` here on purpose — elc-go reaches this over the internal
    # Compose network (`postgres:5432`), and a production DB has no business
    # being reachable from outside the Docker network. For local dev (`air`
    # run on the host, needs a published port), see docker-compose.override.yml
    # (gitignored, never deployed).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elc"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
