name: Detect attribute value anomalies

# Recomputes product_attribute_values.flagged_anomaly (IQR outlier check per
# number-type attribute across the whole catalog) so internal/ai's
# search_products tool never grounds a customer answer in a statistically
# implausible spec value — see
# docs/rfc/2026-08-18-product-data-anomaly-detection.md and
# cmd/detect-attribute-anomalies/main.go. Idempotent, daily is plenty; the
# catalog doesn't churn hour to hour. workflow_dispatch lets it be re-run on
# demand right after a bulk data fix.
on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily
  workflow_dispatch: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Run detect-attribute-anomalies on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /var/www/elc-go
            DATABASE_URL=$(grep '^DATABASE_URL=' .env | cut -d= -f2-)

            docker run --rm --network elc-go_default \
              -e DATABASE_URL="$DATABASE_URL" \
              -v "$(pwd):/app" -w /app golang:1.26-alpine \
              sh -c "apk add --no-cache ca-certificates >/dev/null 2>&1 && go run ./cmd/detect-attribute-anomalies"
