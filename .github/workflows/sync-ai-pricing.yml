name: Sync AI provider pricing

# Keeps ai_models.pricing current from each provider's official pricing
# page instead of a one-time hand-typed snapshot — see
# docs/rfc/2026-08-18-ai-chat-phase1-admin-fallback-guardrail.md and
# cmd/sync-ai-pricing/main.go. Daily is plenty; pricing pages don't change
# hour to hour. workflow_dispatch lets it be re-run on demand (e.g. right
# after adding a new provider/model in the admin panel).
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync-ai-pricing on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /var/www/elc-go
            DATABASE_URL=$(grep '^DATABASE_URL=' .env | cut -d= -f2-)
            AI_SECRETS_ENCRYPTION_KEY=$(grep '^AI_SECRETS_ENCRYPTION_KEY=' .env | cut -d= -f2-)

            docker run --rm --network elc-go_default \
              -e DATABASE_URL="$DATABASE_URL" \
              -e AI_SECRETS_ENCRYPTION_KEY="$AI_SECRETS_ENCRYPTION_KEY" \
              -v "$(pwd):/app" -w /app golang:1.26-alpine \
              sh -c "apk add --no-cache ca-certificates >/dev/null 2>&1 && go run ./cmd/sync-ai-pricing"
