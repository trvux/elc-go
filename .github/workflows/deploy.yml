name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rsync source to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /var/www/elc-go"
          # --delete mirrors the repo exactly onto the VPS — must exclude
          # everything that only ever exists on the VPS itself (never in
          # git), or it gets wiped every deploy. `backups/` holds the nightly
          # cron pg_dumps — losing it here would delete the backups on every
          # future deploy.
          rsync -az --delete \
            --exclude '.git' --exclude '.env' --exclude 'backups/' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/elc-go/"

      - name: Write .env and (re)deploy container on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_PRIVATE_BUCKET_NAME: ${{ secrets.R2_PRIVATE_BUCKET_NAME }}
          R2_PRIVATE_ACCESS_KEY_ID: ${{ secrets.R2_PRIVATE_ACCESS_KEY_ID }}
          R2_PRIVATE_SECRET_ACCESS_KEY: ${{ secrets.R2_PRIVATE_SECRET_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: POSTGRES_PASSWORD,JWT_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,R2_PUBLIC_URL,R2_PRIVATE_BUCKET_NAME,R2_PRIVATE_ACCESS_KEY_ID,R2_PRIVATE_SECRET_ACCESS_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,ADMIN_EMAILS,GA4_MEASUREMENT_ID,GA4_API_SECRET
          script: |
            set -e
            cd /var/www/elc-go
            cat > .env <<EOF
            ENV=production
            PORT=8090
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            DATABASE_URL=postgresql://elc:${POSTGRES_PASSWORD}@postgres:5432/elc
            JWT_SECRET=${JWT_SECRET}
            APP_BASE_URL=https://dienmayelc.com.vn
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            ADMIN_EMAILS=${ADMIN_EMAILS}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USERNAME=${SMTP_USERNAME}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            SMTP_FROM=${SMTP_FROM}
            R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            R2_BUCKET_NAME=${R2_BUCKET_NAME}
            R2_PUBLIC_URL=${R2_PUBLIC_URL}
            R2_PRIVATE_BUCKET_NAME=${R2_PRIVATE_BUCKET_NAME}
            R2_PRIVATE_ACCESS_KEY_ID=${R2_PRIVATE_ACCESS_KEY_ID}
            R2_PRIVATE_SECRET_ACCESS_KEY=${R2_PRIVATE_SECRET_ACCESS_KEY}
            GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID}
            GA4_API_SECRET=${GA4_API_SECRET}
            EOF
            chmod +x scripts/*.sh

            # Build truoc (khong dung toi container dang chay), roi moi swap.
            # --pull: re-fetch the golang/alpine base images every deploy. Without
            # it the VPS kept a 4-month-old golang:1.26-alpine, so production was
            # built with Go 1.26.4 and missed every stdlib security patch since.
            docker compose build --pull

            # Dua Postgres len truoc va cho khoe, roi moi chay migration.
            docker compose up -d --wait --wait-timeout 60 postgres

            # Chay migration cho tung module (internal/*/migrations) TRUOC khi
            # swap container elc-go moi, de code Go moi (da doi cot/bang moi)
            # khong khoi dong tren schema cu. Neu buoc nay loi, script thoat
            # non-zero va container elc-go CU (chua dong toi) van tiep tuc
            # phuc vu, site khong sap.
            DATABASE_URL="postgresql://elc:${POSTGRES_PASSWORD}@postgres:5432/elc" \
              ./scripts/migrate-all.sh

            # --wait doi container moi qua HEALTHCHECK (curl /brands) roi moi
            # tra ve thanh cong -- khong con coi deploy la "xong" ngay khi tien
            # trinh moi khoi dong nhung chua thuc su san sang nhan request.
            docker compose up -d --wait --wait-timeout 60

            # Cron backup hang dem cho Postgres tu host (volume khong phai la
            # backup) -- idempotent, chi them dong crontab neu chua co.
            #
            # `|| true` sau grep -v: found 2026-07-19, day la ly do that su
            # cron bi mat suot 11 ngay ma khong deploy nao bao loi -- khi
            # crontab chi co dung 1 dong (chinh dong backup-postgres.sh) hoac
            # rong, grep -v loc het, khong con dong nao -> grep thoat exit 1
            # (quy uoc cua grep: khong dong nao duoc chon = exit 1). Duoi
            # `set -e` o dau script, exit 1 nay giet ngay subshell TRUOC KHI
            # dong echo kip chay, nen `crontab -` nhan stdin rong va ghi de
            # thanh crontab RONG -- deploy van bao "success" vi day la lenh
            # cuoi cung, khong co buoc nao sau do de phat hien loi.
            ( crontab -l 2>/dev/null | grep -v 'backup-postgres.sh' || true ; \
              echo "0 3 * * * /var/www/elc-go/scripts/backup-postgres.sh >> /var/www/elc-go/backups/backup.log 2>&1" \
            ) | crontab -

            # Don image dangling + build cache cu sau moi deploy. Build chay ngay
            # tren VPS nen moi lan deploy de lai image Go cu + cache; khong don
            # thi /var/lib/containerd phinh tuyen tinh (da tung 37GB, 2026-10-08).
            # `|| true`: don dep that bai khong duoc lam deploy that bai.
            docker image prune -f || true
            docker builder prune -f --filter until=72h || true
