name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rsync source to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /var/www/elc-go"
          # --delete mirrors the repo exactly onto the VPS — must exclude
          # everything that only ever exists on the VPS itself (never in
          # git), or it gets wiped every deploy. `backups/` holds the nightly
          # cron pg_dumps AND the migrate-postgres.sh sentinel
          # (.postgres-migrated) that gates the one-time Supabase import from
          # re-running — losing either here would silently re-trigger a full
          # destructive re-import (or delete backups) on every future deploy.
          rsync -az --delete \
            --exclude '.git' --exclude '.env' --exclude 'backups/' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/elc-go/"

      - name: Write .env and (re)deploy container on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          # NOTE: this secret is Supabase's OLD connection string. It is no
          # longer written into the app's own .env (see SOURCE_DATABASE_URL
          # below) — it's kept only as the one-time source for
          # scripts/migrate-postgres.sh's dump-and-restore. Safe to delete
          # this secret once the self-hosted Postgres has run clean in
          # production for a while.
          SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SOURCE_DATABASE_URL,POSTGRES_PASSWORD,JWT_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,R2_PUBLIC_URL
          script: |
            set -e
            cd /var/www/elc-go
            cat > .env <<EOF
            ENV=production
            PORT=8090
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            DATABASE_URL=postgresql://elc:${POSTGRES_PASSWORD}@postgres:5432/elc
            JWT_SECRET=${JWT_SECRET}
            ADMIN_BASE_URL=https://dienmayelc.com.vn
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USERNAME=${SMTP_USERNAME}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            SMTP_FROM=${SMTP_FROM}
            R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            R2_BUCKET_NAME=${R2_BUCKET_NAME}
            R2_PUBLIC_URL=${R2_PUBLIC_URL}
            EOF
            chmod +x scripts/*.sh

            # Build truoc (khong dung toi container dang chay), roi moi swap.
            docker compose build

            # Dua Postgres len truoc va cho khoe, roi moi chay migration mot-lan
            # (idempotent qua sentinel file) TRUOC khi dung toi elc-go -- neu
            # migration that bai, container elc-go CU (dang chay, van tro ve
            # Supabase qua .env cu cua no) khong bi dong, site khong sap.
            docker compose up -d --wait --wait-timeout 60 postgres
            SOURCE_DATABASE_URL="$SOURCE_DATABASE_URL" POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              ./scripts/migrate-postgres.sh

            # Chay migration cho tung module (internal/*/migrations) TRUOC khi
            # swap container elc-go moi -- day la buoc truoc day BI THIEU: script
            # migrate-postgres.sh o tren chi chay dung 1 lan (cutover Supabase),
            # khong ap dung migration moi cho tung lan deploy sau do, nen code Go
            # moi (da doi cot/bang moi) tung khoi dong dung schema cu va loi ngay.
            # Neu buoc nay loi, script thoat non-zero va container elc-go CU
            # (chua dong toi) van tiep tuc phuc vu -- giong dung tinh an toan da
            # co o buoc migrate-postgres.sh ben tren.
            DATABASE_URL="postgresql://elc:${POSTGRES_PASSWORD}@postgres:5432/elc" \
              ./scripts/migrate-all.sh

            # Backup + seed + migrate legacy products.specs -> structured
            # attribute_definitions/product_attribute_values. Idempotent
            # (see script header) -- safe no-op on every deploy after the
            # first. Runs after migrate-all.sh (needs the new tables to
            # exist) and before the container swap, same safety reasoning
            # as migrate-all.sh above: a failure here leaves the OLD elc-go
            # container running untouched.
            DATABASE_URL="postgresql://elc:${POSTGRES_PASSWORD}@postgres:5432/elc" \
              ./scripts/deploy-attribute-migration.sh

            # --wait doi container moi qua HEALTHCHECK (curl /brands) roi moi
            # tra ve thanh cong -- khong con coi deploy la "xong" ngay khi tien
            # trinh moi khoi dong nhung chua thuc su san sang nhan request.
            docker compose up -d --wait --wait-timeout 60

            # Cron backup hang dem cho Postgres tu host (volume khong phai la
            # backup) -- idempotent, chi them dong crontab neu chua co.
            #
            # `|| true` sau grep -v: found 2026-07-19, day la ly do that su
            # cron bi mat suot 11 ngay ma khong deploy nao bao loi -- khi
            # crontab chi co dung 1 dong (chinh dong backup-postgres.sh) hoac
            # rong, grep -v loc het, khong con dong nao -> grep thoat exit 1
            # (quy uoc cua grep: khong dong nao duoc chon = exit 1). Duoi
            # `set -e` o dau script, exit 1 nay giet ngay subshell TRUOC KHI
            # dong echo kip chay, nen `crontab -` nhan stdin rong va ghi de
            # thanh crontab RONG -- deploy van bao "success" vi day la lenh
            # cuoi cung, khong co buoc nao sau do de phat hien loi.
            ( crontab -l 2>/dev/null | grep -v 'backup-postgres.sh' || true ; \
              echo "0 3 * * * /var/www/elc-go/scripts/backup-postgres.sh >> /var/www/elc-go/backups/backup.log 2>&1" \
            ) | crontab -
