name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rsync source to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /var/www/elc-go"
          rsync -az --delete \
            --exclude '.git' --exclude '.env' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/elc-go/"

      - name: Write .env and (re)deploy container on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,CLOUDFLARE_ZONE_ID,CLOUDFLARE_API_TOKEN
          script: |
            cd /var/www/elc-go
            cat > .env <<EOF
            ENV=production
            PORT=8090
            DATABASE_URL=${DATABASE_URL}
            EOF
            # Build truoc (khong dung toi container dang chay), roi moi swap.
            # --wait doi container moi qua HEALTHCHECK (curl /brands) roi moi
            # tra ve thanh cong -- khong con coi deploy la "xong" ngay khi tien
            # trinh moi khoi dong nhung chua thuc su san sang nhan request.
            docker compose build
            docker compose up -d --wait --wait-timeout 60

            # Next.js goi truc tiep vao Go API qua "use cache" -- neu Cloudflare
            # tinh co crawl dung luc container cu vua tat/moi vua len (truoc khi
            # healthy), no co the dinh mot ban HTML rong vao edge cache. Purge
            # ngay sau khi xac nhan container khoe de don sach ban do (neu co).
            if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data '{"purge_everything":true}' \
                && echo "Cloudflare cache purged" \
                || echo "Cloudflare purge failed (non-fatal)"
            fi
